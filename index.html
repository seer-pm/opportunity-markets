<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/assets/head/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/head/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/assets/head/android-icon-192x192.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/head/apple-icon-180x180.png"
    />
    <link rel="manifest" href="/assets/head/manifest.json" />
    <meta
      name="description"
      content="Community proposals become market outcomes. Trade on which ideas get chosen, and earn rewards when yours wins."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Seer" />
    <meta property="og:title" content="Opportunity Markets · Seer" />
    <meta
      property="og:image"
      content="https://opportunity.seer.pm/assets/head/ms-icon-310x310.png"
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@seer_pm" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seer · Opportunity Markets</title>
    <script>
      (() => {
        let preference;
        try {
          preference = localStorage.getItem('seer-opportunity-theme');
        } catch {}
        document.documentElement.dataset.theme =
          preference === 'light' || preference === 'dark'
            ? preference
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
      })();
    </script>
  </head>
  <body>
    <!--
      THESIS: Live selections and their evidence lead to the trade.
      OWN-WORLD: Electric Foundation from @seer-pm/ui-kit; Open Sans, hairlines, theme-aware surfaces.
      STORY: Understand the selection, read live prices, inspect submissions, then trade or redeem.
      FIRST VIEWPORT: Seer Opportunity Markets lockup; home opens with the current live opportunity;
      detail opens with its question, current reading and responsible identities before trading.
      FORM: User-pinned Electric Foundation; home, archive and market detail share one operating language.
      FINISH: Review the shipped desktop and mobile views in both themes and record the built system in DESIGN.md.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
